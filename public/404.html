<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Evergreen Silver Missions - Redirecting...</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafgraph/spa-github-pages
        // This script takes the current url and converts the path and query
        // string into just a query string, and then redirects the browser
        // to the new url with a special query string like:
        // https://qiangcui.github.io/evergreensilvermissions/?p=/programs&q=key=value

        var l = window.location;
        var segments = l.pathname.split('/');
        var spaRoutes = ['mission', 'programs', 'donate', 'contact', 'privacy', 'terms', 'register'];

        // Default is 0 for custom domain root
        // If the first segment is NOT a known route, it might be a branch folder (e.g., /new/)
        var pathSegmentsToKeep = 0;
        if (segments[1] && !spaRoutes.includes(segments[1]) && segments[1] !== "") {
            pathSegmentsToKeep = 1;
        }

        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            segments.slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>

<body>
    Redirecting...
</body>

</html>
